# donchian_atr - Donchian close-confirm + ATR expansion regime.
# Long/short when close breaks prior entry_len channel AND
# ATR(fast)/ATR(slow) >= atr_ratio_min (expanding vol). Exit: opposite
# exit_len Donchian OR ATR stop OR time.
id = "donchian_atr"

[plugin]
type = "donchian_atr"
direction = "both"
exit_method = "donchian_atr_exp"
session_utc_start = [14, 30]

[[params]]
name = "entry_len"
type = "int"
min = 12.0
max = 55.0

[[params]]
name = "exit_len"
type = "int"
min = 5.0
max = 25.0

[[params]]
name = "atr_fast"
type = "int"
min = 8.0
max = 20.0

[[params]]
name = "atr_slow"
type = "int"
min = 30.0
max = 80.0

[[params]]
name = "atr_ratio_min"
type = "float"
min = 0.85
max = 1.40

[[params]]
name = "stop_mult"
type = "float"
min = 1.0
max = 3.0

[[params]]
name = "allow_short"
type = "int"
min = 0.0
max = 1.0

[[params]]
name = "exit_after_bars"
type = "int"
min = 10.0
max = 80.0
