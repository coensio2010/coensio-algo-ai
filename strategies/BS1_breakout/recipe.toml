# BS1_breakout - ATR-scaled breakout of a point-of-interest (POI) level with two
# switchable confirmation filters (filter1/filter2 pick an indicator + params).
# Exit: opposite Donchian channel. Long-only by default.
id = "BS1_breakout"

[plugin]
type = "BS1_breakout"
direction = "long"
exit_method = "opposite_donchian"
session_utc_start = [22, 0]
session_utc_end = [8, 0]

[[params]]
name = "poi_method"
type = "int"
min = 2.0
max = 8.0

[[params]]
name = "donchian_period"
type = "int"
min = 12.0
max = 17.0

[[params]]
name = "breakout_atr_mult"
type = "float"
min = 0.90
max = 2.00

[[params]]
name = "breakout_atr_period"
type = "int"
min = 20.0
max = 28.0

[[params]]
name = "filter1_method"
type = "int"
min = 2.0
max = 40.0

[[params]]
name = "filter1_param1"
type = "int"
min = 1.0
max = 20.0

[[params]]
name = "filter1_param2"
type = "int"
min = 1.0
max = 20.0

[[params]]
name = "filter2_method"
type = "int"
min = 2.0
max = 40.0

[[params]]
name = "filter2_param1"
type = "int"
min = 1.0
max = 20.0

[[params]]
name = "filter2_param2"
type = "int"
min = 1.0
max = 20.0
