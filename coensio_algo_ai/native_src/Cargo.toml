[package]
name = "engine-core"
version = "0.1.0"
edition = "2021"
build = "build.rs"
authors = ["coensio <https://coensio.com>"]
description = "coensio-algo-ai native engine - powered by coesnio.com"
license = "MIT"

[lib]
name = "engine_core"
crate-type = ["cdylib"]

[dependencies]
# abi3-py311: one binary works on every CPython >= 3.11 (Windows / Linux / macOS).
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
once_cell = "1.20"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
